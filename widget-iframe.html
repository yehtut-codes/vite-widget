<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget</title>
    <style>
        /* Reset and base styles for iframe */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #my-widget-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Override widget styles for iframe */
        .widget-iframe-wrapper {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 1rem;
        }
        
        /* Error state */
        .error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #ff6b6b;
            color: white;
            padding: 1rem;
            text-align: center;
        }
    </style>
    <!-- Widget CSS -->
    <link rel="stylesheet" href="./assets/my-widget.css">
</head>
<body>
    <!-- Loading state -->
    <div id="loading" class="loading">
        Loading widget...
    </div>
    
    <!-- Error state (hidden by default) -->
    <div id="error" class="error" style="display: none;">
        <h3>Widget Error</h3>
        <p>Failed to load widget. Please try again later.</p>
    </div>
    
    <!-- Widget container - This is where React will render -->
    <div id="my-widget-container"></div>

    <!-- Widget CSS -->
    <link rel="stylesheet" href="./assets/my-widget.css">
    
    <!-- Widget JavaScript -->
    <script src="./my-widget.iife.js"></script>
    <script>
        // Simple, reliable initialization
        (function() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const container = document.getElementById('my-widget-container');
            
            // Parse URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const config = {
                theme: urlParams.get('theme') || 'default',
                apiKey: urlParams.get('apiKey') || undefined,
                debug: urlParams.get('debug') === 'true'
            };
            
            // Remove undefined values
            Object.keys(config).forEach(key => 
                config[key] === undefined && delete config[key]
            );
            
            let retryCount = 0;
            const maxRetries = 100; // 10 seconds
            
            function attemptInit() {
                try {
                    if (config.debug) {
                        console.log('[Widget Debug] Attempt:', retryCount);
                        console.log('[Widget Debug] window.MyWidget:', window.MyWidget);
                        console.log('[Widget Debug] typeof MyWidget:', typeof window.MyWidget);
                    }
                    
                    // Check if MyWidget global is available
                    if (typeof window.MyWidget === 'undefined') {
                        retryCount++;
                        if (retryCount < maxRetries) {
                            setTimeout(attemptInit, 100);
                            return;
                        } else {
                            throw new Error('MyWidget script failed to load');
                        }
                    }
                    
                    // Try to find the init function
                    let initFn = null;
                    
                    if (typeof window.MyWidget.initMyWidget === 'function') {
                        initFn = window.MyWidget.initMyWidget;
                    } else if (typeof window.MyWidget.default === 'object' && typeof window.MyWidget.default.initMyWidget === 'function') {
                        initFn = window.MyWidget.default.initMyWidget;
                    }
                    
                    if (config.debug) {
                        console.log('[Widget Debug] initFn found:', !!initFn);
                        console.log('[Widget Debug] MyWidget keys:', Object.keys(window.MyWidget));
                    }
                    
                    if (!initFn) {
                        throw new Error('initMyWidget function not found. Available: ' + Object.keys(window.MyWidget).join(', '));
                    }
                    
                    // Call initialization
                    initFn(config, {
                        onSuccess: function(instance) {
                            if (config.debug) {
                                console.log('[Widget Debug] Success!', instance);
                            }
                            loading.style.display = 'none';
                            
                            // Notify parent
                            if (window.parent !== window) {
                                window.parent.postMessage({
                                    type: 'widget-loaded',
                                    data: { config }
                                }, '*');
                            }
                        },
                        onError: function(err) {
                            throw err;
                        }
                    });
                    
                } catch (err) {
                    console.error('[Widget Error]', err);
                    loading.style.display = 'none';
                    error.style.display = 'flex';
                    error.querySelector('p').textContent = err.message || 'Widget failed to load';
                    
                    if (window.parent !== window) {
                        window.parent.postMessage({
                            type: 'widget-error',
                            data: { error: err.message }
                        }, '*');
                    }
                }
            }
            
            // Wait for script to load
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => setTimeout(attemptInit, 100));
            } else {
                setTimeout(attemptInit, 100);
            }
        })();
            
            // Handle window resize for responsive iframe
            function handleResize() {
                const height = document.body.scrollHeight;
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'widget-resize',
                        data: { height }
                    }, '*');
                }
            }
            
            window.addEventListener('resize', handleResize);
            setTimeout(handleResize, 1000); // Initial resize after load
        })();
    </script>
</body>
</html>
